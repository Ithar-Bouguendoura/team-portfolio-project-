<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lehrizi Habiba Malak - Profile</title>
    <link rel="stylesheet" href="../profile.css">

<body>
    <div class="container">
        <!-- Decorative background elements -->
        <div class="bg-circle-1"></div>

                            <div class="glow-effect"></div>

                            <div class="profile-image-container">

                                <img
